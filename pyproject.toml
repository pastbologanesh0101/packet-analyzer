[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pktanalyzer"
version = "0.1.0"
description = "A from-scratch pcap parser and TCP/IP traffic analyzer: Ethernet/ARP/IPv4/IPv6/TCP/UDP/ICMP/DNS dissection, flow tracking, live capture"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vishwanathan Tamizharasan" }]
keywords = ["networking", "pcap", "tcp-ip", "packet-analysis", "wireshark", "tcpdump", "protocol-dissector"]

[project.scripts]
pktanalyzer = "pktanalyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pktanalyzer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
